name: Update Fudan RSS Feeds

on:
  # 定时触发：北京时间每天上午 08:00 (UTC 00:00)
  schedule:
    - cron: '0 0 * * *'
  
  # 手动触发：允许在 Actions 页面点击 "Run workflow" 手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_rss:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # 获取完整历史，防止推送冲突

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 feedgen

    - name: Sync and Run Scripts
      run: |
        # 1. 配置 Git 身份
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 2. 在运行脚本前先拉取远程更新，确保工作区是“干净”且最新的
        git pull origin main --rebase
        
        # 3. 运行 Python 脚本生成新的 XML 文件（直接覆盖本地旧文件）
        python fudan_jwc.py
        python econ_rss.py
        
        # 4. 将生成的两个 XML 文件加入暂存区
        git add fudan_jwc.xml fudan_econ.xml
        
        # 5. 检查是否有实质性的内容更新
        if git diff --staged --quiet; then
          echo "检测到内容与上次一致，无需更新仓库。"
        else
          # 6. 提交并推送，彻底覆盖远程版本
          git commit -m "Auto-update RSS feeds: $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
        fi
